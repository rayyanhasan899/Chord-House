name: Foundation checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: chord_house
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: chord_house_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chord_house -d chord_house_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CHORD_PYTHON: python
      CHORD_TEST_DATABASE_URL: postgresql+psycopg://chord_house:ci_disposable_only@127.0.0.1:5432/chord_house_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.lock
        working-directory: backend
      - run: python -m pip install --no-deps -e .
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m ruff check --config pyproject.toml . ../scripts/dev.py
        working-directory: backend
      - run: python -m ruff format --config pyproject.toml --check . ../scripts/dev.py
        working-directory: backend
      - run: python -m mypy app
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python tests/browser_system.py
        working-directory: backend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase15-administration-evidence
          path: .artifacts/phase15-administration.png
          if-no-files-found: ignore
