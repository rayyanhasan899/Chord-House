name: Foundation checks
env:
  NEXT_TELEMETRY_DISABLED: "1"
on: [push, pull_request]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .artifacts/audit-venv
      - run: .artifacts/audit-venv/bin/python -m pip install pip-audit==2.10.1
      - run: .artifacts/audit-venv/bin/python -m pip_audit -r backend/requirements-dev.lock --no-deps --disable-pip -f json -o .artifacts/security/python.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase17-dependency-evidence
          path: .artifacts/security/*.json
          if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            browser_args: --project=chromium --project=mobile-chromium-emulated
          - engine: firefox
            browser_args: --project=firefox
          - engine: webkit
            browser_args: --project=webkit --project=mobile-webkit-emulated
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: chord_house
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: chord_house_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chord_house -d chord_house_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CHORD_PYTHON: python
      DEBUG: ${{ matrix.engine == 'firefox' && 'pw:browser' || '' }}
      XDG_RUNTIME_DIR: /tmp/chord-quality-runtime
      PULSE_SERVER: unix:/tmp/chord-quality-runtime/pulse/native
      CHORD_TEST_DATABASE_URL: postgresql+psycopg://chord_house:ci_disposable_only@postgres:5432/chord_house_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -c "import ssl; print(ssl.OPENSSL_VERSION)"
      - run: python -m pip install -r requirements-dev.lock -r requirements-cloud.txt
        working-directory: backend
      - run: python -m pip install --no-deps -e .
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: python -m ruff check --config pyproject.toml . ../scripts/dev.py ../scripts/dev-preview.py
        working-directory: backend
      - run: python -m ruff format --config pyproject.toml --check . ../scripts/dev.py ../scripts/dev-preview.py
        working-directory: backend
      - run: python -m mypy app
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python tests/profile_quality.py
        working-directory: backend
      - run: chown "$(id -u):$(id -g)" /github/home
      - name: Provide a virtual audio output for native browser clocks
        run: |
          phase_audio_ready=0
          for phase_mirror in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu https://mirrors.mit.edu/ubuntu; do
            sed -i -E "s@^URIs:.*@URIs: $phase_mirror@" /etc/apt/sources.list.d/ubuntu.sources
            if apt-get -o Acquire::Retries=1 -o Acquire::ForceIPv4=true -o Acquire::https::Timeout=10 -o APT::Update::Error-Mode=any update && apt-get -o Acquire::Retries=1 -o Acquire::ForceIPv4=true -o Acquire::https::Timeout=10 install -y --no-install-recommends pulseaudio pulseaudio-utils; then
              phase_audio_ready=1
              break
            fi
          done
          test "$phase_audio_ready" = 1
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          env -u PULSE_SERVER pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=chord_quality rate=48000
          pactl set-default-sink chord_quality
          pactl info
      - run: python tests/browser_system.py ${{ matrix.browser_args }}
        working-directory: backend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase18-quality-evidence-${{ matrix.engine }}
          include-hidden-files: true
          path: |
            .artifacts/phase18-*.json
            frontend/test-results/results.json
            frontend/test-results/**/error-context.md
            frontend/test-results/**/attachments/*.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase15-administration-evidence-${{ matrix.engine }}
          path: |
            .artifacts/phase15-administration.png
            frontend/test-results/content-*/error-context.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase16-learning-evidence-${{ matrix.engine }}
          path: |
            .artifacts/phase16-training.png
            frontend/test-results/training-*/error-context.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase17-privacy-evidence-${{ matrix.engine }}
          path: |
            .artifacts/phase17-privacy.png
            frontend/test-results/security-*/error-context.md
          if-no-files-found: ignore
