[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
[project]
name = "chord-house-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2,<3", "alembic>=1,<2", "psycopg[binary]>=3,<4", "pydantic-settings>=2,<3", "argon2-cffi>=25", "email-validator>=2"]
[project.optional-dependencies]
dev = ["pytest", "httpx2", "ruff", "mypy"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
"app.modules.catalog" = ["data/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.isort]
known-first-party = ["app"]
[tool.mypy]
python_version = "3.14"
strict = true
